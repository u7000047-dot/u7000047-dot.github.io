<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Scrolling Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #87ceeb;
        }
        .info {
            position: absolute;
            color: black;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }
        #score {
            top: 10px;
            left: 10px;
        }
        #controls {
            bottom: 10px;
            left: 10px;
            font-size: 14px;
        }
        #version {
            bottom: 10px;
            right: 10px;
            font-size: 14px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
            min-width: 300px;
        }
        #gameOver h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ffd700;
        }
        #gameOver p {
            font-size: 20px;
            margin-bottom: 20px;
        }
        #gameOver button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #gameOver button:hover {
            background: #764ba2;
        }
        #pauseMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 30, 0.95);
            color: white;
            padding: 40px 48px;
            border-radius: 12px;
            text-align: center;
            display: none;
            z-index: 200;
            min-width: 320px;
            border: 2px solid #667eea;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.4);
        }
        #pauseMenu h2 {
            font-size: 30px;
            margin-bottom: 28px;
            color: #ffd700;
            letter-spacing: 2px;
        }
        #pauseMenu button {
            display: block;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s, transform 0.1s;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        #pauseMenu button:hover {
            background: #764ba2;
            transform: scale(1.02);
        }
        #pauseMenu button:last-of-type {
            margin-bottom: 0;
        }
        #pauseMenu .btn-danger {
            background: #c0392b;
        }
        #pauseMenu .btn-danger:hover {
            background: #922b21;
        }
        #pauseMenu .btn-success {
            background: #27ae60;
        }
        #pauseMenu .btn-success:hover {
            background: #1e8449;
        }
        #importFileInput {
            display: none;
        }
        #statsBtn {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 60, 0.88);
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 6px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            z-index: 10;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #statsBtn:hover { background: rgba(60, 50, 10, 0.95); }
        #statsBadge {
            display: none;
            background: #ff4422;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            font-size: 12px;
            margin-left: 7px;
            vertical-align: middle;
            font-weight: bold;
        }
        #statsMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 30, 0.97);
            color: white;
            padding: 36px 44px;
            border-radius: 12px;
            text-align: center;
            display: none;
            z-index: 210;
            min-width: 380px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.25);
        }
        #statsMenu h2 { font-size: 26px; margin-bottom: 6px; color: #ffd700; }
        #statsMenu .pts { font-size: 14px; color: #aaa; margin-bottom: 22px; }
        #statsMenu .pts span { color: #ffd700; font-weight: bold; font-size: 16px; }
        #statsMenu .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 15px;
            gap: 10px;
        }
        #statsMenu .stat-label { text-align: left; flex: 1; }
        #statsMenu .stat-val { width: 52px; text-align: center; color: #7ec8e3; font-weight: bold; font-size: 16px; }
        #statsMenu .upg-btn {
            background: #27ae60; color: white; border: none;
            padding: 5px 14px; border-radius: 5px; cursor: pointer;
            font-size: 13px; font-weight: bold; transition: background 0.2s; white-space: nowrap;
        }
        #statsMenu .upg-btn:hover:not(:disabled) { background: #1e8449; }
        #statsMenu .upg-btn:disabled { background: #444; color: #888; cursor: default; }
        #statsMenu .close-btn {
            margin-top: 22px; background: #667eea; color: white; border: none;
            padding: 10px 34px; border-radius: 6px; cursor: pointer;
            font-size: 15px; font-weight: bold; transition: background 0.2s;
        }
        #statsMenu .close-btn:hover { background: #764ba2; }
        #charizardCutscene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            z-index: 300;
        }
        #charizardCutscene canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #charizardGlow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 55%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 30%, rgba(255,255,255,0) 68%);
            opacity: 0;
            pointer-events: none;
        }
        #charizardCaption {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 84%;
            text-align: center;
            color: #ffbf70;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 40px;
            text-shadow: 0 0 14px rgba(255, 140, 0, 0.65), 2px 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 500ms ease-in;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div id="score" class="info">Score: <span id="scoreValue">0</span></div>
        <button id="statsBtn" onclick="showStatsMenu()">Stats <span id="statsBadge">0</span></button>
        <div id="controls" class="info">A/D: Move | W: Jump | Space: Shoot | ESC: Menu</div>        <div id="version" class="info">v1.0</div>        <div id="statsMenu">
            <h2>&#9650; Stats &amp; Upgrades</h2>
            <div class="pts">Upgrade Points: <span id="upgradePointsDisplay">0</span></div>
            <div class="stat-row">
                <span class="stat-label">&#128293; Fireball Damage</span>
                <span class="stat-val" id="statDamage">1</span>
                <button class="upg-btn" onclick="upgradeStat('damage')">+1 &nbsp;(1pt)</button>
            </div>
            <div class="stat-row">
                <span class="stat-label">&#10084; Max Lives</span>
                <span class="stat-val" id="statLives">3</span>
                <button class="upg-btn" onclick="upgradeStat('playerHealth')">+1 &nbsp;(1pt)</button>
            </div>
            <div class="stat-row">
                <span class="stat-label">&#127968; House Max HP</span>
                <span class="stat-val" id="statHouseHP">100</span>
                <button class="upg-btn" onclick="upgradeStat('houseHealth')">+20 (1pt)</button>
            </div>
            <div class="stat-row">
                <span class="stat-label">&#128694; Move Speed</span>
                <span class="stat-val" id="statSpeed">8</span>
                <button class="upg-btn" onclick="upgradeStat('speed')">+1 &nbsp;(1pt)</button>
            </div>
            <button class="close-btn" onclick="closeStatsMenu()">Close</button>
        </div>
        <div id="gameOver">
            <h1>Game Over!</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
        <div id="pauseMenu">
            <h2>&#9646;&#9646; PAUSED</h2>
            <button onclick="resumeGame()">&#9654; Resume</button>
            <button class="btn-danger" onclick="resetGame()">&#8635; Reset Game</button>
            <button class="btn-success" onclick="exportGameState()">&#8659; Export State</button>
            <button onclick="document.getElementById('importFileInput').click()">&#8657; Import State</button>
            <input type="file" id="importFileInput" accept=".json" onchange="importGameState(event)">
        </div>
        <div id="charizardCutscene">
            <canvas id="charizardCanvas" width="1000" height="600"></canvas>
            <div id="charizardGlow"></div>
            <div id="charizardCaption">Congratulations! Charmander evolved into Charizard!</div>
        </div>
    </div>
    <script>
        // Game Constants
        const SCREEN_WIDTH = 1000;
        const SCREEN_HEIGHT = 600;
        const GROUND_HEIGHT = 100;
        const FPS = 60;
        const WORLD_WIDTH = SCREEN_WIDTH * 2;
        const VERSION = '1.0';
        // Colors
        const COLORS = {
            WHITE: '#ffffff',
            BLACK: '#000000',
            BLUE: '#6495ed',
            RED: '#dc143c',
            GREEN: '#228b22',
            YELLOW: '#ffdf00',
            LIGHT_BLUE: '#87ceeb',
            DARK_GREEN: '#006400'
        };
        // Game State
        const gameState = {
            score: 0,
            gameRunning: true,
            paused: false,
            statsOpen: false,
            cutsceneActive: false,
            keys: {},
            fireballs: [],
            enemyFireballs: [],
            explosions: [],
            miniSlimes: [],
            level: 1,
            levelBannerTimer: 0,
            showLevelBanner: true,
            lives: 3,
            maxLives: 3,
            bossRageFlash: 0,
            upgradePoints: 0,
            stats: {
                damage: 1,       // fireball hits per shot vs normal enemies
                playerHealth: 0, // bonus max lives
                houseHealth: 0,  // bonus house max HP tiers (+20 each)
                speed: 0         // bonus move speed
            }
        };
        // Direction enum
        const Direction = {
            IDLE: 0,
            LEFT: 1,
            RIGHT: 2
        };
        // Player class
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 60;
                this.velocityX = 0;
                this.velocityY = 0;
                this.speed = 5;
                this.maxSpeed = 8;
                this.isJumping = false;
                this.gravity = 0.5;
                this.jumpPower = -15;
                this.direction = Direction.IDLE;
                
                // Load character images
                this.imageLeft = new Image();
                this.imageLeft.src = 'charmander_left.png';
                
                this.imageRight = new Image();
                this.imageRight.src = 'charmander_right.png';
                
                // Default image
                this.currentImage = this.imageRight;
            }
            handleInput(keys) {
                this.velocityX = 0;
                const effectiveSpeed = this.maxSpeed + gameState.stats.speed;
                if (keys['a'] || keys['A']) {
                    this.velocityX = -effectiveSpeed;
                    this.direction = Direction.LEFT;
                    this.currentImage = this.imageLeft;
                }
                if (keys['d'] || keys['D']) {
                    this.velocityX = effectiveSpeed;
                    this.direction = Direction.RIGHT;
                    this.currentImage = this.imageRight;
                }
                if ((keys['w'] || keys['W']) && !this.isJumping) {
                    this.isJumping = true;
                    this.velocityY = this.jumpPower;
                }
            }
            applyGravity() {
                const groundY = SCREEN_HEIGHT - GROUND_HEIGHT - this.height;
                
                // Always apply gravity
                this.velocityY += this.gravity;
                
                // Check if on ground (only reset if moving downward)
                if (this.y >= groundY && this.velocityY >= 0) {
                    this.y = groundY;
                    this.isJumping = false;
                    this.velocityY = 0;
                }
            }
            update(keys) {
                this.handleInput(keys);
                this.applyGravity();
                this.x += this.velocityX;
                this.y += this.velocityY;
                // Keep on screen
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > WORLD_WIDTH) this.x = WORLD_WIDTH - this.width;
            }
            draw(ctx) {
                // Draw character image
                if (this.currentImage.complete) {
                    ctx.drawImage(this.currentImage, this.x, this.y, this.width, this.height);
                } else {
                    // Fallback while image is loading
                    ctx.fillStyle = COLORS.RED;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            }
            getCollisionBox() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }
        // Enemy class
        class Enemy {
            constructor(x, y, patrolCenter) {
                this.x = x;
                this.y = y;
                this.width = 35;
                this.height = 50;
                this.speed = 1.2 + Math.floor(gameState.level / 2) * 0.2;
                this.centerX = patrolCenter;
                this.shootCooldown = Math.random() * 120 + 60; // randomize first shot
                // Health: requires 2 fireball hits to die
                this.maxHealth = 2;
                this.health = this.maxHealth;
            }
            update() {
                // Move slowly toward the center of the screen
                if (Math.abs(this.x + this.width/2 - this.centerX) > 2) {
                    if (this.x + this.width/2 < this.centerX) {
                        this.x += this.speed;
                    } else {
                        this.x -= this.speed;
                    }
                }
                // Shooting logic
                this.shootCooldown--;
                if (this.shootCooldown <= 0) {
                    this.shootAtPlayer();
                    this.shootCooldown = Math.random() * 120 + 60; // shoot every 1-3 seconds
                }
            }
            shootAtPlayer() {
                const player = window.game.gameInstance.player;
                const startX = this.x + this.width/2;
                const startY = this.y + this.height;
                // Calculate direction vector to player
                const dx = player.x + player.width/2 - startX;
                const dy = player.y + player.height/2 - startY;
                const mag = Math.sqrt(dx*dx + dy*dy);
                const speed = 6 + gameState.level * 0.5;
                const vx = dx / mag * speed;
                const vy = dy / mag * speed;
                gameState.enemyFireballs.push(new EnemyFireball(startX, startY, vx, vy));
            }
            draw(ctx) {
                // Draw body
                ctx.fillStyle = COLORS.BLUE;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Draw eyes
                const eyeY = this.y + 15;
                ctx.fillStyle = COLORS.WHITE;
                ctx.beginPath();
                ctx.arc(this.x + 10, eyeY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + this.width - 10, eyeY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = COLORS.BLACK;
                ctx.beginPath();
                ctx.arc(this.x + 10, eyeY, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + this.width - 10, eyeY, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            getCollisionBox() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }
        // EnemyFireball class
        class EnemyFireball {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.vx = vx;
                this.vy = vy;
                this.active = true;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > WORLD_WIDTH || this.y < 0 || this.y > SCREEN_HEIGHT) {
                    this.active = false;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.RED;
                ctx.shadowColor = COLORS.BLACK;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
            getCollisionBox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }
        }
        // MiniSlime — projectile spit by BossSlime, targets the house
        class MiniSlime {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.radius = 11;
                this.active = true;
                const dx = targetX - x;
                const dy = targetY - y;
                const mag = Math.sqrt(dx * dx + dy * dy) || 1;
                const speed = 3 + Math.random() * 2;
                this.vx = (dx / mag) * speed;
                this.vy = (dy / mag) * speed;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -120 || this.x > WORLD_WIDTH + 120 || this.y > SCREEN_HEIGHT + 80) {
                    this.active = false;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#66ee44';
                ctx.shadowColor = '#116611';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.strokeStyle = '#228b22';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(this.x - 3.5, this.y - 2, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 3.5, this.y - 2, 3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(this.x - 2.5, this.y - 1, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 4.5, this.y - 1, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
            getCollisionBox() {
                return { x: this.x - this.radius, y: this.y - this.radius, width: this.radius * 2, height: this.radius * 2 };
            }
        }
        // Player Fireball class
        class Fireball {
            constructor(x, y, dir) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.vx = dir * 12;
                this.vy = 0;
                this.active = true;
            }
            update() {
                this.x += this.vx;
                if (this.x < 0 || this.x > WORLD_WIDTH) {
                    this.active = false;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.YELLOW;
                ctx.shadowColor = COLORS.RED;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();
            }
            getCollisionBox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }
        }
        // House class
        class House {
            constructor() {
                this.x = WORLD_WIDTH / 2 - 100;
                this.y = SCREEN_HEIGHT - GROUND_HEIGHT - 150;
                this.width = 200;
                this.height = 150;
                this.wallThickness = 16;
                this.health = 100;
                this.maxHealth = 100;
                this.frame = 0;
            }
            takeDamage(amount) { this.health = Math.max(0, this.health - amount); }
            repair(amount)     { this.health = Math.min(this.maxHealth, this.health + amount); }
            update()           { this.frame++; }
            isDestroyed()      { return this.health <= 0; }
            getLeftWallBox() {
                if (this.isDestroyed()) return { x: -9999, y: -9999, width: 0, height: 0 };
                return { x: this.x, y: this.y, width: this.wallThickness, height: this.height };
            }
            getRightWallBox() {
                if (this.isDestroyed()) return { x: -9999, y: -9999, width: 0, height: 0 };
                return { x: this.x + this.width - this.wallThickness, y: this.y, width: this.wallThickness, height: this.height };
            }
            drawCracks(ctx, wx, wy, heavy) {
                ctx.save();
                ctx.strokeStyle = '#1a0800';
                ctx.lineWidth = heavy ? 2 : 1.5;
                ctx.beginPath();
                ctx.moveTo(wx + 4, wy + 18); ctx.lineTo(wx + 9, wy + 34); ctx.lineTo(wx + 5, wy + 52);
                ctx.moveTo(wx + 11, wy + 68); ctx.lineTo(wx + 6, wy + 84); ctx.lineTo(wx + 12, wy + 108);
                if (heavy) {
                    ctx.moveTo(wx + 3, wy + 44); ctx.lineTo(wx + 14, wy + 56); ctx.lineTo(wx + 8, wy + 72);
                    ctx.moveTo(wx + 7, wy + 118); ctx.lineTo(wx + 3, wy + 140);
                    ctx.moveTo(wx + 13, wy + 26); ctx.lineTo(wx + 5, wy + 18);
                }
                ctx.stroke();
                ctx.restore();
            }
            drawSmoke(ctx, sx, sy, intensity = 1) {
                ctx.save();
                for (let i = 0; i < 4; i++) {
                    const phase = (this.frame * 0.4 + i * 18) % 70;
                    const px = sx + Math.sin(phase * 0.16) * 6;
                    const py = sy - phase * 0.85 - 4;
                    const alpha = Math.max(0, 0.3 * intensity - phase * 0.004);
                    ctx.fillStyle = `rgba(100,100,100,${alpha.toFixed(3)})`;
                    ctx.beginPath();
                    ctx.arc(px, py, (5 + phase * 0.15) * Math.min(intensity, 1.5), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            drawFire(ctx, wx, wy, ww, wh) {
                const f = this.frame;
                ctx.save();
                for (let i = 0; i < 4; i++) {
                    const fx = wx + (0.14 + i * 0.26) * ww;
                    const fh = 24 + Math.sin(f * 0.19 + i * 1.4) * 10;
                    const fy = wy + wh - 3;
                    ctx.fillStyle = 'rgba(255,65,0,0.92)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 7, fy);
                    ctx.quadraticCurveTo(fx - 2, fy - fh * 0.55, fx, fy - fh);
                    ctx.quadraticCurveTo(fx + 2, fy - fh * 0.55, fx + 7, fy);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(255,215,0,0.78)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 3, fy);
                    ctx.quadraticCurveTo(fx - 1, fy - fh * 0.45, fx, fy - fh * 0.72);
                    ctx.quadraticCurveTo(fx + 1, fy - fh * 0.45, fx + 3, fy);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
            drawWindowFire(ctx, wx, wy, ww) {
                const f = this.frame;
                ctx.save();
                const cx = wx + ww / 2;
                const baseY = wy + 2;
                for (let i = 0; i < 4; i++) {
                    const fx = cx + (i - 1.5) * 9 + Math.sin(f * 0.18 + i * 1.2) * 3;
                    const fh = 18 + Math.sin(f * 0.21 + i * 1.6) * 7;
                    ctx.fillStyle = 'rgba(255,80,0,0.90)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 5, baseY);
                    ctx.quadraticCurveTo(fx - 1, baseY - fh * 0.5, fx, baseY - fh);
                    ctx.quadraticCurveTo(fx + 1, baseY - fh * 0.5, fx + 5, baseY);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(255,210,0,0.72)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 2, baseY);
                    ctx.quadraticCurveTo(fx, baseY - fh * 0.4, fx, baseY - fh * 0.7);
                    ctx.quadraticCurveTo(fx + 2, baseY - fh * 0.4, fx + 2, baseY);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
            drawRoofFire(ctx) {
                const { x, y, width } = this;
                const f = this.frame;
                ctx.save();
                const spots = [
                    { rx: x - 4,            ry: y - 5  },
                    { rx: x + width * 0.25, ry: y - 42 },
                    { rx: x + width * 0.5,  ry: y - 78 },
                    { rx: x + width * 0.75, ry: y - 42 },
                    { rx: x + width + 4,    ry: y - 5  },
                ];
                for (let i = 0; i < spots.length; i++) {
                    const { rx, ry } = spots[i];
                    const fh = 22 + Math.sin(f * 0.2 + i * 1.3) * 9;
                    ctx.fillStyle = 'rgba(255,60,0,0.92)';
                    ctx.beginPath();
                    ctx.moveTo(rx - 8, ry);
                    ctx.quadraticCurveTo(rx - 2, ry - fh * 0.5, rx, ry - fh);
                    ctx.quadraticCurveTo(rx + 2, ry - fh * 0.5, rx + 8, ry);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(255,200,0,0.75)';
                    ctx.beginPath();
                    ctx.moveTo(rx - 4, ry);
                    ctx.quadraticCurveTo(rx, ry - fh * 0.45, rx, ry - fh * 0.78);
                    ctx.quadraticCurveTo(rx + 4, ry - fh * 0.45, rx + 4, ry);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
            drawRubble(ctx) {
                const { x, y, width, height } = this;
                const gY = y + height;
                ctx.save();
                // Debris mound
                ctx.fillStyle = '#7a5c2e';
                ctx.beginPath();
                ctx.moveTo(x - 12, gY);
                ctx.lineTo(x + 15,  gY - 42); ctx.lineTo(x + 48, gY - 28);
                ctx.lineTo(x + 82,  gY - 52); ctx.lineTo(x + 110, gY - 38);
                ctx.lineTo(x + 145, gY - 56); ctx.lineTo(x + 178, gY - 30);
                ctx.lineTo(x + width + 12, gY - 18);
                ctx.lineTo(x + width + 12, gY);
                ctx.closePath(); ctx.fill();
                // Dark base shadow
                ctx.fillStyle = '#4a3010';
                ctx.beginPath();
                ctx.moveTo(x - 12, gY); ctx.lineTo(x + 30, gY - 12);
                ctx.lineTo(x + width / 2, gY - 16); ctx.lineTo(x + width - 20, gY - 10);
                ctx.lineTo(x + width + 12, gY); ctx.closePath(); ctx.fill();
                // Scattered bricks
                const bricks = [
                    { dx: 8,   dy: -38, w: 32, h: 14, rot:  0.35, color: '#c0392b' },
                    { dx: 55,  dy: -22, w: 26, h: 12, rot: -0.25, color: '#a93226' },
                    { dx: 95,  dy: -46, w: 36, h: 14, rot:  0.55, color: '#c0392b' },
                    { dx: 148, dy: -24, w: 28, h: 13, rot: -0.45, color: '#a93226' },
                    { dx: -8,  dy: -10, w: 24, h: 10, rot:  0.65, color: '#d4574e' },
                    { dx: 168, dy: -12, w: 22, h: 10, rot: -0.3,  color: '#c0392b' },
                    { dx: 38,  dy: -48, w: 20, h: 10, rot:  0.8,  color: '#922b21' },
                    { dx: 120, dy: -32, w: 30, h: 12, rot: -0.6,  color: '#a93226' },
                ];
                for (const b of bricks) {
                    ctx.save();
                    ctx.translate(x + b.dx + b.w / 2, gY + b.dy); ctx.rotate(b.rot);
                    ctx.fillStyle = b.color; ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
                    ctx.strokeStyle = '#5c1a15'; ctx.lineWidth = 1;
                    ctx.strokeRect(-b.w/2, -b.h/2, b.w, b.h);
                    ctx.restore();
                }
                // Broken roof beams
                const beams = [
                    { dx: 65,  dy: -50, len: 90, rot: -0.7 },
                    { dx: 130, dy: -38, len: 70, rot:  0.55 },
                    { dx: 20,  dy: -30, len: 50, rot: -0.3 },
                ];
                for (const b of beams) {
                    ctx.save();
                    ctx.translate(x + b.dx, gY + b.dy); ctx.rotate(b.rot);
                    ctx.fillStyle = '#5c3317'; ctx.fillRect(-b.len/2, -4, b.len, 7);
                    ctx.strokeStyle = '#3a1f0a'; ctx.lineWidth = 1;
                    ctx.strokeRect(-b.len/2, -4, b.len, 7);
                    ctx.restore();
                }
                // "DESTROYED" label
                ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
                ctx.fillStyle = '#ff4444';
                ctx.fillText('DESTROYED', x + width / 2, gY - 68);
                // Lingering smoke
                this.drawSmoke(ctx, x + 40,  gY - 35, 0.7);
                this.drawSmoke(ctx, x + 140, gY - 28, 0.6);
                ctx.restore();
            }
            draw(ctx) {
                const { x, y, width, height, wallThickness, health, maxHealth } = this;
                if (health <= 0) { this.drawRubble(ctx); return; }
                const hp = health / maxHealth;
                const lit = Math.floor(44 + hp * 20);
                const wallColor = `hsl(28,48%,${lit}%)`;
                // Main body
                ctx.fillStyle = '#d4a574';
                ctx.fillRect(x, y, width, height);
                // Left / right walls
                ctx.fillStyle = wallColor;
                ctx.fillRect(x, y, wallThickness, height);
                ctx.fillRect(x + width - wallThickness, y, wallThickness, height);
                // Roof (darkens when on fire)
                ctx.fillStyle = hp < 0.5 ? '#5a2a08' : '#8b4513';
                ctx.beginPath();
                ctx.moveTo(x - 12, y); ctx.lineTo(x + width + 12, y); ctx.lineTo(x + width / 2, y - 80);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#5c2e00'; ctx.lineWidth = 2; ctx.stroke();
                // Chimney
                ctx.fillStyle = hp < 0.5 ? '#7b241c' : '#c0392b';
                ctx.fillRect(x + width - 52, y - 78, 22, 52);
                ctx.strokeStyle = '#922b21'; ctx.lineWidth = 1;
                ctx.strokeRect(x + width - 52, y - 78, 22, 52);
                // Door
                ctx.fillStyle = hp < 0.5 ? '#3a1f0a' : '#5c3317';
                ctx.fillRect(x + width / 2 - 22, y + height - 72, 44, 72);
                ctx.beginPath(); ctx.arc(x + width / 2, y + height - 72, 22, Math.PI, 0); ctx.fill();
                if (hp >= 0.5) {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath(); ctx.arc(x + width / 2 + 14, y + height - 36, 4, 0, Math.PI * 2); ctx.fill();
                }
                // Windows — colour shifts red as damage increases
                const lw = x + wallThickness + 8;
                const rw = x + width - wallThickness - 52;
                const winColor = hp < 0.5 ? '#ff5500' : hp < 0.75 ? '#ffbb55' : '#aaddff';
                ctx.fillStyle = winColor;
                ctx.fillRect(lw, y + 22, 44, 36);
                ctx.fillRect(rw, y + 22, 44, 36);
                ctx.strokeStyle = '#5c3317'; ctx.lineWidth = 2;
                ctx.strokeRect(lw, y + 22, 44, 36);
                ctx.strokeRect(rw, y + 22, 44, 36);
                ctx.beginPath();
                ctx.moveTo(lw + 22, y + 22); ctx.lineTo(lw + 22, y + 58);
                ctx.moveTo(lw, y + 40);      ctx.lineTo(lw + 44, y + 40);
                ctx.moveTo(rw + 22, y + 22); ctx.lineTo(rw + 22, y + 58);
                ctx.moveTo(rw, y + 40);      ctx.lineTo(rw + 44, y + 40);
                ctx.stroke();
                // Body outline
                ctx.strokeStyle = '#7a5c2e'; ctx.lineWidth = 2; ctx.strokeRect(x, y, width, height);
                // --- Damage overlays (drawn on top in severity order) ---
                if (hp < 0.75) {
                    this.drawCracks(ctx, x, y, hp < 0.5);
                    this.drawCracks(ctx, x + width - wallThickness, y, hp < 0.5);
                }
                // Chimney smoke starts at 75%
                if (hp < 0.75) this.drawSmoke(ctx, x + width - 41, y - 78, hp < 0.5 ? 1.6 : 0.9);
                // Window fire + wall smoke at 50%
                if (hp < 0.5) {
                    this.drawWindowFire(ctx, lw, y + 22, 44);
                    this.drawWindowFire(ctx, rw, y + 22, 44);
                    this.drawSmoke(ctx, x + wallThickness / 2, y, 1.0);
                    this.drawSmoke(ctx, x + width - wallThickness / 2, y, 1.0);
                }
                // Roof fire + wall base fire at 25%
                if (hp < 0.25) {
                    this.drawRoofFire(ctx);
                    this.drawFire(ctx, x, y, wallThickness, height);
                    this.drawFire(ctx, x + width - wallThickness, y, wallThickness, height);
                    this.drawSmoke(ctx, x + width / 2, y - 80, 2.0);
                }
                // Health bar
                const barY = y - 22;
                ctx.fillStyle = '#222'; ctx.fillRect(x, barY, width, 9);
                ctx.fillStyle = hp > 0.5 ? '#27ae60' : hp > 0.25 ? '#e67e22' : '#e74c3c';
                ctx.fillRect(x, barY, width * hp, 9);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(x, barY, width, 9);
                ctx.save();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
                ctx.fillText('House HP: ' + health, x + width / 2, barY - 3);
                ctx.restore();
            }
        }
        // ChaserEnemy class (triangle) — second enemy type that cannot shoot and moves toward the player
        class ChaserEnemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.speed = 2 + Math.floor(gameState.level / 2) * 0.5;
                // Health: requires 2 fireball hits to die
                this.maxHealth = 2;
                this.health = this.maxHealth;
            }
            update() {
                const player = window.game.gameInstance.player;
                const targetX = player.x + player.width / 2;
                const targetY = player.y + player.height / 2;
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;
                const dx = targetX - cx;
                const dy = targetY - cy;
                const mag = Math.sqrt(dx * dx + dy * dy) || 1;
                this.x += (dx / mag) * this.speed;
                this.y += (dy / mag) * this.speed;
                // Keep within world bounds and above ground
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > WORLD_WIDTH) this.x = WORLD_WIDTH - this.width;
                if (this.y + this.height > SCREEN_HEIGHT - GROUND_HEIGHT) this.y = SCREEN_HEIGHT - GROUND_HEIGHT - this.height;
                if (this.y < 0) this.y = 0;
            }
            draw(ctx) {
                const player = window.game.gameInstance.player;
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;
                const angle = Math.atan2((player.y + player.height / 2) - cy, (player.x + player.width / 2) - cx);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                // Draw triangle pointing toward player
                ctx.fillStyle = COLORS.RED;
                ctx.beginPath();
                ctx.moveTo(this.width / 2, 0);
                ctx.lineTo(-this.width / 2, -this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();
                // Eye
                ctx.fillStyle = COLORS.WHITE;
                ctx.beginPath();
                ctx.arc(this.width * 0.12, -4, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = COLORS.BLACK;
                ctx.beginPath();
                ctx.arc(this.width * 0.12, -4, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            getCollisionBox() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }
        }
        // BossSlime — giant green slime boss, 500 HP, moves from left toward house
        class BossSlime {
            constructor() {
                this.width = 120;
                this.height = 100;
                this.x = -this.width - 20;
                this.y = SCREEN_HEIGHT - GROUND_HEIGHT - this.height;
                this.speed = 0.4;
                this.maxHealth = 500;
                this.health = 500;
                this.spitCooldown = 180; // first spit at 3s, then every 5s
                this.rageTriggered = false;
                this.rageMode = false;
                this.frame = 0;
            }
            getSpitCount() {
                return Math.floor((this.maxHealth - this.health) / 100) + 1;
            }
            update() {
                this.frame++;
                const house = window.game.gameInstance.house;
                if (this.x + this.width < house.x) {
                    this.x += this.speed;
                }
                this.spitCooldown--;
                if (this.spitCooldown <= 0) {
                    this.spit();
                    this.spitCooldown = 300;
                }
                if (this.health <= 100 && !this.rageTriggered) {
                    this.rageTriggered = true;
                    this.rageMode = true;
                    this.spawnSkyRain();
                    gameState.bossRageFlash = 90;
                }
            }
            spit() {
                if (this.rageMode) { this.spawnSkyRain(); return; }
                const count = this.getSpitCount();
                const house = window.game.gameInstance.house;
                const groundY = SCREEN_HEIGHT - GROUND_HEIGHT - 11; // ground level (radius = 11)
                const tx = house.x + house.width / 2;
                for (let i = 0; i < count; i++) {
                    const offsetX = i * 28; // space them out so they don't stack
                    gameState.miniSlimes.push(new MiniSlime(
                        this.x + this.width + offsetX, groundY,
                        tx, groundY  // same Y = purely horizontal crawl
                    ));
                }
            }
            spawnSkyRain() {
                const house = window.game.gameInstance.house;
                const count = 12 + Math.floor(Math.random() * 6);
                for (let i = 0; i < count; i++) {
                    const startX = Math.random() * WORLD_WIDTH;
                    const tx = house.x + house.width / 2 + (Math.random() - 0.5) * house.width * 3;
                    gameState.miniSlimes.push(new MiniSlime(startX, -30 - Math.random() * 100, tx, house.y + house.height / 2));
                }
            }
            draw(ctx) {
                const cx = this.x + this.width / 2;
                const wobble = Math.sin(this.frame * 0.08) * 5;
                const cy = this.y + this.height / 2 + wobble;
                ctx.save();
                ctx.shadowColor = this.rageMode ? '#ff5500' : '#004400';
                ctx.shadowBlur = this.rageMode ? 28 : 16;
                ctx.beginPath();
                ctx.ellipse(cx, cy, this.width / 2, this.height / 2 + Math.abs(wobble) * 0.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.rageMode ? '#33dd22' : '#44cc44';
                ctx.fill();
                ctx.strokeStyle = '#004400';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.shadowBlur = 0;
                // Blob bumps on top
                for (const bx of [-this.width * 0.35, 0, this.width * 0.35]) {
                    ctx.beginPath();
                    ctx.ellipse(cx + bx, cy - this.height * 0.42, 20, 16, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#55dd55';
                    ctx.fill();
                    ctx.strokeStyle = '#004400'; ctx.lineWidth = 2; ctx.stroke();
                }
                // Eyes
                const eyeY = cy - this.height * 0.1;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(cx - 24, eyeY, 15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 24, eyeY, 15, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(cx - 19, eyeY + 3, 8, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 29, eyeY + 3, 8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(cx - 22, eyeY - 3, 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 26, eyeY - 3, 3, 0, Math.PI * 2); ctx.fill();
                // Angry brows when enraged
                if (this.rageMode) {
                    ctx.strokeStyle = '#cc2200'; ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(cx - 40, eyeY - 18); ctx.lineTo(cx - 8, eyeY - 10);
                    ctx.moveTo(cx + 8,  eyeY - 10); ctx.lineTo(cx + 40, eyeY - 18);
                    ctx.stroke();
                }
                // Mouth + drool
                ctx.strokeStyle = '#003300'; ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx - 28, cy + this.height * 0.28);
                ctx.quadraticCurveTo(cx, cy + this.height * 0.44, cx + 28, cy + this.height * 0.28);
                ctx.stroke();
                ctx.fillStyle = '#44dd44';
                ctx.beginPath(); ctx.arc(cx - 8,  cy + this.height * 0.49, 5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 12, cy + this.height * 0.53, 4, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                // Health bar
                const barW = this.width + 30;
                const barX = cx - barW / 2;
                const barY = this.y - 32;
                const hp = this.health / this.maxHealth;
                ctx.fillStyle = '#222'; ctx.fillRect(barX, barY, barW, 14);
                ctx.fillStyle = hp > 0.4 ? '#00cc00' : hp > 0.2 ? '#ddcc00' : '#dd2200';
                ctx.fillRect(barX, barY, barW * hp, 14);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(barX, barY, barW, 14);
                ctx.save();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
                ctx.fillText('BOSS HP: ' + this.health, barX + barW / 2, barY - 5);
                if (this.rageMode) {
                    ctx.fillStyle = '#ff4400'; ctx.font = 'bold 15px Arial';
                    ctx.fillText('!! ENRAGED !!', barX + barW / 2, barY - 22);
                }
                ctx.restore();
            }
            getCollisionBox() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }
        }
        // Explosion visual effect used when chaser hits the house
        class Explosion {
            constructor(x, y, opts = {}) {
                this.x = x;
                this.y = y;
                this.frame = 0;
                this.duration = opts.duration || 70;
                this.particles = [];
                const count = opts.count || 36;
                const colors = ['#ff9f1c', '#ff3c00', '#ffd166', '#ff6b6b'];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6;
                    this.particles.push({
                        x: 0,
                        y: 0,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed * 0.6 - 1.5,
                        life: 30 + Math.random() * 30,
                        maxLife: 30 + Math.random() * 30,
                        size: 3 + Math.random() * 6,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
                this.smoke = [];
                for (let i = 0; i < 8; i++) {
                    this.smoke.push({ x: (Math.random() - 0.5) * 20, y: (Math.random() - 0.5) * 10, vx: (Math.random() - 0.5) * 0.6, vy: -1 - Math.random() * 0.5, life: 40 + Math.random() * 30 });
                }
                this.done = false;
            }
            update() {
                this.frame++;
                let alive = false;
                for (const p of this.particles) {
                    p.vy += 0.18; // gravity
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                    p.life -= 1;
                    if (p.life > 0) alive = true;
                }
                for (const s of this.smoke) {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vy *= 0.995;
                    s.life -= 1;
                    if (s.life > 0) alive = true;
                }
                if (!alive || this.frame > this.duration) this.done = true;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                // shock ring
                const ringRadius = Math.min(this.frame * 3.2, 120);
                const ringAlpha = Math.max(0, 0.6 - this.frame / this.duration);
                if (ringAlpha > 0.02) {
                    ctx.beginPath();
                    ctx.lineWidth = 6 * (1 - this.frame / this.duration);
                    ctx.strokeStyle = `rgba(255,200,80,${ringAlpha.toFixed(3)})`;
                    ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
                // particles (glow)
                ctx.globalCompositeOperation = 'lighter';
                for (const p of this.particles) {
                    if (p.life <= 0) continue;
                    const t = p.life / p.maxLife;
                    const alpha = Math.max(0, Math.min(1, t));
                    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
                    grd.addColorStop(0, p.color);
                    grd.addColorStop(0.5, p.color);
                    grd.addColorStop(1, `rgba(0,0,0,0)`);
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * (1 + (1 - t)), 0, Math.PI * 2);
                    ctx.globalAlpha = alpha;
                    ctx.fill();
                }
                // smoke (soft dark clouds)
                ctx.globalCompositeOperation = 'source-over';
                for (const s of this.smoke) {
                    if (s.life <= 0) continue;
                    const alpha = Math.max(0, Math.min(0.6, s.life / 80));
                    ctx.fillStyle = `rgba(60,60,60,${alpha.toFixed(3)})`;
                    ctx.beginPath();
                    ctx.ellipse(s.x, s.y, 18, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }
        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&

                        if (!ms.active || checkCollision(ms.getCollisionBox(), houseBox)) {
                            if (ms.active) {
                                gameState.explosions.push(new Explosion(ms.x, ms.y, { count: 18, duration: 45 }));
                                this.house.takeDamage(15);
                            }

                    gameState.miniSlimes = gameState.miniSlimes.filter(ms => ms.active);

                        gameState.maxLives += 1;

                    if (gameState.level % 5 === 0) {
                        gameState.upgradePoints += gameState.level / 5;
                        updateStatsBadge();

                    gameState.showLevelBanner = true;
                    gameState.levelBannerTimer = 0;
                    if (gameState.level === 11 && typeof window.playCharizardCutscene === 'function') {

            }
            draw() {
                // Clear screen
                this.ctx.fillStyle = COLORS.LIGHT_BLUE;
                this.ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

                // Apply camera offset for all world elements
                this.ctx.save();
                this.ctx.translate(-this.cameraX, 0);

                // Draw sky
                this.ctx.fillStyle = COLORS.LIGHT_BLUE;
                this.ctx.fillRect(0, 0, WORLD_WIDTH, SCREEN_HEIGHT - GROUND_HEIGHT);
                // Draw ground
                this.ctx.fillStyle = COLORS.GREEN;
                this.ctx.fillRect(0, SCREEN_HEIGHT - GROUND_HEIGHT, WORLD_WIDTH, GROUND_HEIGHT);

                this.ctx.strokeStyle = COLORS.DARK_GREEN;
                this.ctx.lineWidth = 2;

                this.house.draw(this.ctx);
                // Draw player
                this.player.draw(this.ctx);

                for (let enemy of this.enemies) {
                    enemy.draw(this.ctx);
                }
                // Draw fireballs
                for (let fireball of gameState.fireballs) {
                    fireball.draw(this.ctx);
                }
                // Draw enemy fireballs
                for (let efb of gameState.enemyFireballs) {
                    efb.draw(this.ctx);
                }
                // Draw explosions (world space)
                for (let exp of gameState.explosions) {
                    exp.draw(this.ctx);
                }
                // Draw mini-slimes
                for (let ms of gameState.miniSlimes) {
                    ms.draw(this.ctx);
                }

                this.ctx.restore(); // Remove camera transform — UI drawn in screen space below

                // Update score display
                document.getElementById('scoreValue').textContent = gameState.score;
                // Draw lives
                this.ctx.save();
                this.ctx.font = 'bold 28px Arial';
                this.ctx.fillStyle = COLORS.RED;
                this.ctx.textAlign = 'left';
                this.ctx.fillText('Lives: ' + gameState.lives, 20, 60);
                this.ctx.restore();
                // Boss rage screen flash
                if (gameState.bossRageFlash > 0) {
                    const flashAlpha = (gameState.bossRageFlash / 90) * 0.45;
                    this.ctx.save();
                    this.ctx.fillStyle = `rgba(255,50,0,${flashAlpha.toFixed(3)})`;
                    this.ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
                    if (gameState.bossRageFlash > 30) {
                        const textAlpha = Math.min(1, (gameState.bossRageFlash - 30) / 30);

                    this.ctx.globalAlpha = 1.0;
                    this.ctx.fillStyle = COLORS.YELLOW;

                    this.ctx.textAlign = 'center';

        function closeStatsMenu() {

        function upgradeStat(stat) {
            if (gameState.upgradePoints <= 0) return;
            gameState.upgradePoints--;
            if (stat === 'damage') {
                gameState.stats.damage++;
            } else if (stat === 'playerHealth') {
                gameState.stats.playerHealth++;

            } else if (stat === 'houseHealth') {
                gameState.stats.houseHealth++;

                if (game && game.house) {
                    game.house.maxHealth += 20;

                if ((e.key === 'c' || e.key === 'C') && gameState.paused && typeof window.playCharizardCutscene === 'function') {

                    const fireball = new Fireball(

                        player.y + player.height/2,
                        dir

                gameState.keys[e.key] = false;

                        mixer = new THREE.AnimationMixer(model);
                        const clip = gltf.animations.find(a => a.name.includes('rangeattack01'))
                            || gltf.animations.find(a => a.name.includes('attack01'))
                            || gltf.animations[0];
                        if (clip) {
                            rangeAttackAction = mixer.clipAction(clip);
                            rangeAttackAction.setLoop(THREE.LoopRepeat, Infinity);
                        }
                        clock = new THREE.Clock();
                        resolve();
                    },
                    undefined,
                    (err) => {
                        sceneReadyPromise = null; // allow a later call to retry instead of staying rejected forever
                        reject(err);
                    }
                );
            });
            return sceneReadyPromise;
        }

        // Start fetching/parsing the (~23MB) model as soon as the page loads, so it's already
        // in memory well before level 11 — the multi-second download would otherwise stall
        // the cutscene with a blank screen if only started when the cutscene is triggered.
        loadCharizardScene().catch((err) => {
            console.error('Charizard model preload failed (will retry on first cutscene trigger):', err);
        });

        window.playCharizardCutscene = async function playCharizardCutscene(onComplete) {
            const overlay = document.getElementById('charizardCutscene');
            const glow = document.getElementById('charizardGlow');
            const caption = document.getElementById('charizardCaption');
            overlay.style.display = 'block';

            try {
                await loadCharizardScene();
            } catch (err) {
                console.error('Charizard cutscene failed to load:', err);
                overlay.style.display = 'none';
                onComplete();
                return;
            }

            if (rangeAttackAction) rangeAttackAction.reset().play();
            clock.getDelta(); // discard idle time accumulated since load

            // Flash the glow in, then let it fade out on its own schedule (CSS-driven, decoupled from the render loop).
            glow.style.transition = 'none';
            glow.style.opacity = '1';
            void glow.offsetWidth; // force reflow so opacity:1 registers before the transition starts
            glow.style.transition = `opacity ${GLOW_DURATION_MS}ms ease-out`;
            glow.style.opacity = '0';

            // Caption starts hidden; it fades in once the caption phase begins.
            caption.style.transition = 'none';
            caption.style.opacity = '0';
            void caption.offsetWidth;
            caption.style.transition = 'opacity 500ms ease-in';

            const radius = camera.userData.radius;
            const closeRadius = radius * CLOSE_RADIUS_FACTOR;
            const height = camera.userData.height;
            const skyLookY = radius * 3; // a point high above the model, simulating "facing the sky"
            const white = new THREE.Color(0xffffff);
            const black = new THREE.Color(0x000000);
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / CUTSCENE_DURATION_MS, 1);

                if (elapsed <= REVEAL_DURATION_MS) {
                    // Reveal phase: background fades white -> black, camera holds close and pans down from sky to Charizard.
                    const revealT = elapsed / REVEAL_DURATION_MS;
                    scene.background.copy(white).lerp(black, revealT);
                    camera.position.set(0, height, closeRadius);
                    camera.lookAt(0, skyLookY + (0 - skyLookY) * revealT, 0);
                } else if (elapsed <= REVEAL_DURATION_MS + ORBIT_DURATION_MS) {
                    // Orbit phase: rotate 180 degrees around the model while zooming back out to the normal distance.
                    scene.background.copy(black);
                    const orbitT = (elapsed - REVEAL_DURATION_MS) / ORBIT_DURATION_MS;
                    const angle = orbitT * Math.PI;
                    const currentRadius = closeRadius + (radius - closeRadius) * orbitT;
                    camera.position.set(Math.sin(angle) * currentRadius, height, Math.cos(angle) * currentRadius);
                    camera.lookAt(0, 0, 0);
                } else {
                    // Caption phase: hold the final framing and show the congratulations text.
                    scene.background.copy(black);
                    camera.position.set(0, height, -radius);
                    camera.lookAt(0, 0, 0);
                    if (caption.style.opacity !== '1') caption.style.opacity = '1';
                }

                if (mixer) mixer.update(clock.getDelta());
                renderer.render(scene, camera);

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    if (rangeAttackAction) rangeAttackAction.stop();
                    caption.style.transition = 'none';
                    caption.style.opacity = '0';
                    overlay.style.display = 'none';
                    onComplete();
                }
            }
            requestAnimationFrame(animate);
        };
    </script>
</body>
