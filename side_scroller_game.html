<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Scrolling Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #87ceeb;
        }
        .info {
            position: absolute;
            color: black;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }
        #score {
            top: 10px;
            left: 10px;
        }
        #controls {
            bottom: 10px;
            left: 10px;
            font-size: 14px;
        }
        #version {
            bottom: 10px;
            right: 10px;
            font-size: 14px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
            min-width: 300px;
        }
        #gameOver h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ffd700;
        }
        #gameOver p {
            font-size: 20px;
            margin-bottom: 20px;
        }
        #gameOver button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #gameOver button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div id="score" class="info">Score: <span id="scoreValue">0</span></div>
        <div id="controls" class="info">A/D: Move | W: Jump | ESC: Quit</div>        <div id="version" class="info">v1.0</div>        <div id="gameOver">
            <h1>Game Over!</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>
    <script>
        // Game Constants
        const SCREEN_WIDTH = 1000;
        const SCREEN_HEIGHT = 600;
        const GROUND_HEIGHT = 100;
        const FPS = 60;
        const WORLD_WIDTH = SCREEN_WIDTH * 2;
        const VERSION = '1.0';
        // Colors
        const COLORS = {
            WHITE: '#ffffff',
            BLACK: '#000000',
            BLUE: '#6495ed',
            RED: '#dc143c',
            GREEN: '#228b22',
            YELLOW: '#ffdf00',
            LIGHT_BLUE: '#87ceeb',
            DARK_GREEN: '#006400'
        };
        // Game State
        const gameState = {
            score: 0,
            gameRunning: true,
            keys: {},
            fireballs: [],
            enemyFireballs: [],
            explosions: [],
            level: 1,
            levelBannerTimer: 0,
            showLevelBanner: true,
            lives: 3,
            maxLives: 3
        };
        // Direction enum
        const Direction = {
            IDLE: 0,
            LEFT: 1,
            RIGHT: 2
        };
        // Player class
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 60;
                this.velocityX = 0;
                this.velocityY = 0;
                this.speed = 5;
                this.maxSpeed = 8;
                this.isJumping = false;
                this.gravity = 0.5;
                this.jumpPower = -15;
                this.direction = Direction.IDLE;
                
                // Load character images
                this.imageLeft = new Image();
                this.imageLeft.src = 'charmander_left.png';
                
                this.imageRight = new Image();
                this.imageRight.src = 'charmander_right.png';
                
                // Default image
                this.currentImage = this.imageRight;
            }
            handleInput(keys) {
                this.velocityX = 0;
                if (keys['a'] || keys['A']) {
                    this.velocityX = -this.maxSpeed;
                    this.direction = Direction.LEFT;
                    this.currentImage = this.imageLeft;
                }
                if (keys['d'] || keys['D']) {
                    this.velocityX = this.maxSpeed;
                    this.direction = Direction.RIGHT;
                    this.currentImage = this.imageRight;
                }
                if ((keys['w'] || keys['W']) && !this.isJumping) {
                    this.isJumping = true;
                    this.velocityY = this.jumpPower;
                }
            }
            applyGravity() {
                const groundY = SCREEN_HEIGHT - GROUND_HEIGHT - this.height;
                
                // Always apply gravity
                this.velocityY += this.gravity;
                
                // Check if on ground (only reset if moving downward)
                if (this.y >= groundY && this.velocityY >= 0) {
                    this.y = groundY;
                    this.isJumping = false;
                    this.velocityY = 0;
                }
            }
            update(keys) {
                this.handleInput(keys);
                this.applyGravity();
                this.x += this.velocityX;
                this.y += this.velocityY;
                // Keep on screen
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > WORLD_WIDTH) this.x = WORLD_WIDTH - this.width;
            }
            draw(ctx) {
                // Draw character image
                if (this.currentImage.complete) {
                    ctx.drawImage(this.currentImage, this.x, this.y, this.width, this.height);
                } else {
                    // Fallback while image is loading
                    ctx.fillStyle = COLORS.RED;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            }
            getCollisionBox() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }
        // Enemy class
        class Enemy {
            constructor(x, y, patrolCenter) {
                this.x = x;
                this.y = y;
                this.width = 35;
                this.height = 50;
                this.speed = 1.2 + Math.floor(gameState.level / 2) * 0.2;
                this.centerX = patrolCenter;
                this.shootCooldown = Math.random() * 120 + 60; // randomize first shot
                // Health: requires 2 fireball hits to die
                this.maxHealth = 2;
                this.health = this.maxHealth;
            }
            update() {
                // Move slowly toward the center of the screen
                if (Math.abs(this.x + this.width/2 - this.centerX) > 2) {
                    if (this.x + this.width/2 < this.centerX) {
                        this.x += this.speed;
                    } else {
                        this.x -= this.speed;
                    }
                }
                // Shooting logic
                this.shootCooldown--;
                if (this.shootCooldown <= 0) {
                    this.shootAtPlayer();
                    this.shootCooldown = Math.random() * 120 + 60; // shoot every 1-3 seconds
                }
            }
            shootAtPlayer() {
                const player = window.game.gameInstance.player;
                const startX = this.x + this.width/2;
                const startY = this.y + this.height;
                // Calculate direction vector to player
                const dx = player.x + player.width/2 - startX;
                const dy = player.y + player.height/2 - startY;
                const mag = Math.sqrt(dx*dx + dy*dy);
                const speed = 6 + gameState.level * 0.5;
                const vx = dx / mag * speed;
                const vy = dy / mag * speed;
                gameState.enemyFireballs.push(new EnemyFireball(startX, startY, vx, vy));
            }
            draw(ctx) {
                // Draw body
                ctx.fillStyle = COLORS.BLUE;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Draw eyes
                const eyeY = this.y + 15;
                ctx.fillStyle = COLORS.WHITE;
                ctx.beginPath();
                ctx.arc(this.x + 10, eyeY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + this.width - 10, eyeY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = COLORS.BLACK;
                ctx.beginPath();
                ctx.arc(this.x + 10, eyeY, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + this.width - 10, eyeY, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            getCollisionBox() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }
        // EnemyFireball class
        class EnemyFireball {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.vx = vx;
                this.vy = vy;
                this.active = true;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > WORLD_WIDTH || this.y < 0 || this.y > SCREEN_HEIGHT) {
                    this.active = false;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.RED;
                ctx.shadowColor = COLORS.BLACK;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
            getCollisionBox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }
        }
        // Player Fireball class
        class Fireball {
            constructor(x, y, dir) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.vx = dir * 12;
                this.vy = 0;
                this.active = true;
            }
            update() {
                this.x += this.vx;
                if (this.x < 0 || this.x > WORLD_WIDTH) {
                    this.active = false;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.YELLOW;
                ctx.shadowColor = COLORS.RED;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();
            }
            getCollisionBox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }
        }
        // House class
        class House {
            constructor() {
                this.x = WORLD_WIDTH / 2 - 100;
                this.y = SCREEN_HEIGHT - GROUND_HEIGHT - 150;
                this.width = 200;
                this.height = 150;
                this.wallThickness = 16;
                this.health = 100;
                this.maxHealth = 100;
                this.frame = 0;
            }
            takeDamage(amount) { this.health = Math.max(0, this.health - amount); }
            repair(amount)     { this.health = Math.min(this.maxHealth, this.health + amount); }
            update()           { this.frame++; }
            isDestroyed()      { return this.health <= 0; }
            getLeftWallBox() {
                if (this.isDestroyed()) return { x: -9999, y: -9999, width: 0, height: 0 };
                return { x: this.x, y: this.y, width: this.wallThickness, height: this.height };
            }
            getRightWallBox() {
                if (this.isDestroyed()) return { x: -9999, y: -9999, width: 0, height: 0 };
                return { x: this.x + this.width - this.wallThickness, y: this.y, width: this.wallThickness, height: this.height };
            }
            drawCracks(ctx, wx, wy, heavy) {
                ctx.save();
                ctx.strokeStyle = '#1a0800';
                ctx.lineWidth = heavy ? 2 : 1.5;
                ctx.beginPath();
                ctx.moveTo(wx + 4, wy + 18); ctx.lineTo(wx + 9, wy + 34); ctx.lineTo(wx + 5, wy + 52);
                ctx.moveTo(wx + 11, wy + 68); ctx.lineTo(wx + 6, wy + 84); ctx.lineTo(wx + 12, wy + 108);
                if (heavy) {
                    ctx.moveTo(wx + 3, wy + 44); ctx.lineTo(wx + 14, wy + 56); ctx.lineTo(wx + 8, wy + 72);
                    ctx.moveTo(wx + 7, wy + 118); ctx.lineTo(wx + 3, wy + 140);
                    ctx.moveTo(wx + 13, wy + 26); ctx.lineTo(wx + 5, wy + 18);
                }
                ctx.stroke();
                ctx.restore();
            }
            drawSmoke(ctx, sx, sy, intensity = 1) {
                ctx.save();
                for (let i = 0; i < 4; i++) {
                    const phase = (this.frame * 0.4 + i * 18) % 70;
                    const px = sx + Math.sin(phase * 0.16) * 6;
                    const py = sy - phase * 0.85 - 4;
                    const alpha = Math.max(0, 0.3 * intensity - phase * 0.004);
                    ctx.fillStyle = `rgba(100,100,100,${alpha.toFixed(3)})`;
                    ctx.beginPath();
                    ctx.arc(px, py, (5 + phase * 0.15) * Math.min(intensity, 1.5), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            drawFire(ctx, wx, wy, ww, wh) {
                const f = this.frame;
                ctx.save();
                for (let i = 0; i < 4; i++) {
                    const fx = wx + (0.14 + i * 0.26) * ww;
                    const fh = 24 + Math.sin(f * 0.19 + i * 1.4) * 10;
                    const fy = wy + wh - 3;
                    ctx.fillStyle = 'rgba(255,65,0,0.92)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 7, fy);
                    ctx.quadraticCurveTo(fx - 2, fy - fh * 0.55, fx, fy - fh);
                    ctx.quadraticCurveTo(fx + 2, fy - fh * 0.55, fx + 7, fy);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(255,215,0,0.78)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 3, fy);
                    ctx.quadraticCurveTo(fx - 1, fy - fh * 0.45, fx, fy - fh * 0.72);
                    ctx.quadraticCurveTo(fx + 1, fy - fh * 0.45, fx + 3, fy);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
            drawWindowFire(ctx, wx, wy, ww) {
                const f = this.frame;
                ctx.save();
                const cx = wx + ww / 2;
                const baseY = wy + 2;
                for (let i = 0; i < 4; i++) {
                    const fx = cx + (i - 1.5) * 9 + Math.sin(f * 0.18 + i * 1.2) * 3;
                    const fh = 18 + Math.sin(f * 0.21 + i * 1.6) * 7;
                    ctx.fillStyle = 'rgba(255,80,0,0.90)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 5, baseY);
                    ctx.quadraticCurveTo(fx - 1, baseY - fh * 0.5, fx, baseY - fh);
                    ctx.quadraticCurveTo(fx + 1, baseY - fh * 0.5, fx + 5, baseY);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(255,210,0,0.72)';
                    ctx.beginPath();
                    ctx.moveTo(fx - 2, baseY);
                    ctx.quadraticCurveTo(fx, baseY - fh * 0.4, fx, baseY - fh * 0.7);
                    ctx.quadraticCurveTo(fx + 2, baseY - fh * 0.4, fx + 2, baseY);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
            drawRoofFire(ctx) {
                const { x, y, width } = this;
                const f = this.frame;
                ctx.save();
                const spots = [
                    { rx: x - 4,            ry: y - 5  },
                    { rx: x + width * 0.25, ry: y - 42 },
                    { rx: x + width * 0.5,  ry: y - 78 },
                    { rx: x + width * 0.75, ry: y - 42 },
                    { rx: x + width + 4,    ry: y - 5  },
                ];
                for (let i = 0; i < spots.length; i++) {
                    const { rx, ry } = spots[i];
                    const fh = 22 + Math.sin(f * 0.2 + i * 1.3) * 9;
                    ctx.fillStyle = 'rgba(255,60,0,0.92)';
                    ctx.beginPath();
                    ctx.moveTo(rx - 8, ry);
                    ctx.quadraticCurveTo(rx - 2, ry - fh * 0.5, rx, ry - fh);
                    ctx.quadraticCurveTo(rx + 2, ry - fh * 0.5, rx + 8, ry);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(255,200,0,0.75)';
                    ctx.beginPath();
                    ctx.moveTo(rx - 4, ry);
                    ctx.quadraticCurveTo(rx, ry - fh * 0.45, rx, ry - fh * 0.78);
                    ctx.quadraticCurveTo(rx + 4, ry - fh * 0.45, rx + 4, ry);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
            drawRubble(ctx) {
                const { x, y, width, height } = this;
                const gY = y + height;
                ctx.save();
                // Debris mound
                ctx.fillStyle = '#7a5c2e';
                ctx.beginPath();
                ctx.moveTo(x - 12, gY);
                ctx.lineTo(x + 15,  gY - 42); ctx.lineTo(x + 48, gY - 28);
                ctx.lineTo(x + 82,  gY - 52); ctx.lineTo(x + 110, gY - 38);
                ctx.lineTo(x + 145, gY - 56); ctx.lineTo(x + 178, gY - 30);
                ctx.lineTo(x + width + 12, gY - 18);
                ctx.lineTo(x + width + 12, gY);
                ctx.closePath(); ctx.fill();
                // Dark base shadow
                ctx.fillStyle = '#4a3010';
                ctx.beginPath();
                ctx.moveTo(x - 12, gY); ctx.lineTo(x + 30, gY - 12);
                ctx.lineTo(x + width / 2, gY - 16); ctx.lineTo(x + width - 20, gY - 10);
                ctx.lineTo(x + width + 12, gY); ctx.closePath(); ctx.fill();
                // Scattered bricks
                const bricks = [
                    { dx: 8,   dy: -38, w: 32, h: 14, rot:  0.35, color: '#c0392b' },
                    { dx: 55,  dy: -22, w: 26, h: 12, rot: -0.25, color: '#a93226' },
                    { dx: 95,  dy: -46, w: 36, h: 14, rot:  0.55, color: '#c0392b' },
                    { dx: 148, dy: -24, w: 28, h: 13, rot: -0.45, color: '#a93226' },
                    { dx: -8,  dy: -10, w: 24, h: 10, rot:  0.65, color: '#d4574e' },
                    { dx: 168, dy: -12, w: 22, h: 10, rot: -0.3,  color: '#c0392b' },
                    { dx: 38,  dy: -48, w: 20, h: 10, rot:  0.8,  color: '#922b21' },
                    { dx: 120, dy: -32, w: 30, h: 12, rot: -0.6,  color: '#a93226' },
                ];
                for (const b of bricks) {
                    ctx.save();
                    ctx.translate(x + b.dx + b.w / 2, gY + b.dy); ctx.rotate(b.rot);
                    ctx.fillStyle = b.color; ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
                    ctx.strokeStyle = '#5c1a15'; ctx.lineWidth = 1;
                    ctx.strokeRect(-b.w/2, -b.h/2, b.w, b.h);
                    ctx.restore();
                }
                // Broken roof beams
                const beams = [
                    { dx: 65,  dy: -50, len: 90, rot: -0.7 },
                    { dx: 130, dy: -38, len: 70, rot:  0.55 },
                    { dx: 20,  dy: -30, len: 50, rot: -0.3 },
                ];
                for (const b of beams) {
                    ctx.save();
                    ctx.translate(x + b.dx, gY + b.dy); ctx.rotate(b.rot);
                    ctx.fillStyle = '#5c3317'; ctx.fillRect(-b.len/2, -4, b.len, 7);
                    ctx.strokeStyle = '#3a1f0a'; ctx.lineWidth = 1;
                    ctx.strokeRect(-b.len/2, -4, b.len, 7);
                    ctx.restore();
                }
                // "DESTROYED" label
                ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
                ctx.fillStyle = '#ff4444';
                ctx.fillText('DESTROYED', x + width / 2, gY - 68);
                // Lingering smoke
                this.drawSmoke(ctx, x + 40,  gY - 35, 0.7);
                this.drawSmoke(ctx, x + 140, gY - 28, 0.6);
                ctx.restore();
            }
            draw(ctx) {
                const { x, y, width, height, wallThickness, health, maxHealth } = this;
                if (health <= 0) { this.drawRubble(ctx); return; }
                const hp = health / maxHealth;
                const lit = Math.floor(44 + hp * 20);
                const wallColor = `hsl(28,48%,${lit}%)`;
                // Main body
                ctx.fillStyle = '#d4a574';
                ctx.fillRect(x, y, width, height);
                // Left / right walls
                ctx.fillStyle = wallColor;
                ctx.fillRect(x, y, wallThickness, height);
                ctx.fillRect(x + width - wallThickness, y, wallThickness, height);
                // Roof (darkens when on fire)
                ctx.fillStyle = hp < 0.5 ? '#5a2a08' : '#8b4513';
                ctx.beginPath();
                ctx.moveTo(x - 12, y); ctx.lineTo(x + width + 12, y); ctx.lineTo(x + width / 2, y - 80);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#5c2e00'; ctx.lineWidth = 2; ctx.stroke();
                // Chimney
                ctx.fillStyle = hp < 0.5 ? '#7b241c' : '#c0392b';
                ctx.fillRect(x + width - 52, y - 78, 22, 52);
                ctx.strokeStyle = '#922b21'; ctx.lineWidth = 1;
                ctx.strokeRect(x + width - 52, y - 78, 22, 52);
                // Door
                ctx.fillStyle = hp < 0.5 ? '#3a1f0a' : '#5c3317';
                ctx.fillRect(x + width / 2 - 22, y + height - 72, 44, 72);
                ctx.beginPath(); ctx.arc(x + width / 2, y + height - 72, 22, Math.PI, 0); ctx.fill();
                if (hp >= 0.5) {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath(); ctx.arc(x + width / 2 + 14, y + height - 36, 4, 0, Math.PI * 2); ctx.fill();
                }
                // Windows — colour shifts red as damage increases
                const lw = x + wallThickness + 8;
                const rw = x + width - wallThickness - 52;
                const winColor = hp < 0.5 ? '#ff5500' : hp < 0.75 ? '#ffbb55' : '#aaddff';
                ctx.fillStyle = winColor;
                ctx.fillRect(lw, y + 22, 44, 36);
                ctx.fillRect(rw, y + 22, 44, 36);
                ctx.strokeStyle = '#5c3317'; ctx.lineWidth = 2;
                ctx.strokeRect(lw, y + 22, 44, 36);
                ctx.strokeRect(rw, y + 22, 44, 36);
                ctx.beginPath();
                ctx.moveTo(lw + 22, y + 22); ctx.lineTo(lw + 22, y + 58);
                ctx.moveTo(lw, y + 40);      ctx.lineTo(lw + 44, y + 40);
                ctx.moveTo(rw + 22, y + 22); ctx.lineTo(rw + 22, y + 58);
                ctx.moveTo(rw, y + 40);      ctx.lineTo(rw + 44, y + 40);
                ctx.stroke();
                // Body outline
                ctx.strokeStyle = '#7a5c2e'; ctx.lineWidth = 2; ctx.strokeRect(x, y, width, height);
                // --- Damage overlays (drawn on top in severity order) ---
                if (hp < 0.75) {
                    this.drawCracks(ctx, x, y, hp < 0.5);
                    this.drawCracks(ctx, x + width - wallThickness, y, hp < 0.5);
                }
                // Chimney smoke starts at 75%
                if (hp < 0.75) this.drawSmoke(ctx, x + width - 41, y - 78, hp < 0.5 ? 1.6 : 0.9);
                // Window fire + wall smoke at 50%
                if (hp < 0.5) {
                    this.drawWindowFire(ctx, lw, y + 22, 44);
                    this.drawWindowFire(ctx, rw, y + 22, 44);
                    this.drawSmoke(ctx, x + wallThickness / 2, y, 1.0);
                    this.drawSmoke(ctx, x + width - wallThickness / 2, y, 1.0);
                }
                // Roof fire + wall base fire at 25%
                if (hp < 0.25) {
                    this.drawRoofFire(ctx);
                    this.drawFire(ctx, x, y, wallThickness, height);
                    this.drawFire(ctx, x + width - wallThickness, y, wallThickness, height);
                    this.drawSmoke(ctx, x + width / 2, y - 80, 2.0);
                }
                // Health bar
                const barY = y - 22;
                ctx.fillStyle = '#222'; ctx.fillRect(x, barY, width, 9);
                ctx.fillStyle = hp > 0.5 ? '#27ae60' : hp > 0.25 ? '#e67e22' : '#e74c3c';
                ctx.fillRect(x, barY, width * hp, 9);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(x, barY, width, 9);
                ctx.save();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
                ctx.fillText('House HP: ' + health, x + width / 2, barY - 3);
                ctx.restore();
            }
        }
        // ChaserEnemy class (triangle) — second enemy type that cannot shoot and moves toward the player
        class ChaserEnemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.speed = 2 + Math.floor(gameState.level / 2) * 0.5;
                // Health: requires 2 fireball hits to die
                this.maxHealth = 2;
                this.health = this.maxHealth;
            }
            update() {
                const player = window.game.gameInstance.player;
                const targetX = player.x + player.width / 2;
                const targetY = player.y + player.height / 2;
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;
                const dx = targetX - cx;
                const dy = targetY - cy;
                const mag = Math.sqrt(dx * dx + dy * dy) || 1;
                this.x += (dx / mag) * this.speed;
                this.y += (dy / mag) * this.speed;
                // Keep within world bounds and above ground
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > WORLD_WIDTH) this.x = WORLD_WIDTH - this.width;
                if (this.y + this.height > SCREEN_HEIGHT - GROUND_HEIGHT) this.y = SCREEN_HEIGHT - GROUND_HEIGHT - this.height;
                if (this.y < 0) this.y = 0;
            }
            draw(ctx) {
                const player = window.game.gameInstance.player;
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;
                const angle = Math.atan2((player.y + player.height / 2) - cy, (player.x + player.width / 2) - cx);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                // Draw triangle pointing toward player
                ctx.fillStyle = COLORS.RED;
                ctx.beginPath();
                ctx.moveTo(this.width / 2, 0);
                ctx.lineTo(-this.width / 2, -this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();
                // Eye
                ctx.fillStyle = COLORS.WHITE;
                ctx.beginPath();
                ctx.arc(this.width * 0.12, -4, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = COLORS.BLACK;
                ctx.beginPath();
                ctx.arc(this.width * 0.12, -4, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            getCollisionBox() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }
        }
        // Explosion visual effect used when chaser hits the house
        class Explosion {
            constructor(x, y, opts = {}) {
                this.x = x;
                this.y = y;
                this.frame = 0;
                this.duration = opts.duration || 70;
                this.particles = [];
                const count = opts.count || 36;
                const colors = ['#ff9f1c', '#ff3c00', '#ffd166', '#ff6b6b'];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6;
                    this.particles.push({
                        x: 0,
                        y: 0,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed * 0.6 - 1.5,
                        life: 30 + Math.random() * 30,
                        maxLife: 30 + Math.random() * 30,
                        size: 3 + Math.random() * 6,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
                this.smoke = [];
                for (let i = 0; i < 8; i++) {
                    this.smoke.push({ x: (Math.random() - 0.5) * 20, y: (Math.random() - 0.5) * 10, vx: (Math.random() - 0.5) * 0.6, vy: -1 - Math.random() * 0.5, life: 40 + Math.random() * 30 });
                }
                this.done = false;
            }
            update() {
                this.frame++;
                let alive = false;
                for (const p of this.particles) {
                    p.vy += 0.18; // gravity
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                    p.life -= 1;
                    if (p.life > 0) alive = true;
                }
                for (const s of this.smoke) {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vy *= 0.995;
                    s.life -= 1;
                    if (s.life > 0) alive = true;
                }
                if (!alive || this.frame > this.duration) this.done = true;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                // shock ring
                const ringRadius = Math.min(this.frame * 3.2, 120);
                const ringAlpha = Math.max(0, 0.6 - this.frame / this.duration);
                if (ringAlpha > 0.02) {
                    ctx.beginPath();
                    ctx.lineWidth = 6 * (1 - this.frame / this.duration);
                    ctx.strokeStyle = `rgba(255,200,80,${ringAlpha.toFixed(3)})`;
                    ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
                // particles (glow)
                ctx.globalCompositeOperation = 'lighter';
                for (const p of this.particles) {
                    if (p.life <= 0) continue;
                    const t = p.life / p.maxLife;
                    const alpha = Math.max(0, Math.min(1, t));
                    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
                    grd.addColorStop(0, p.color);
                    grd.addColorStop(0.5, p.color);
                    grd.addColorStop(1, `rgba(0,0,0,0)`);
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * (1 + (1 - t)), 0, Math.PI * 2);
                    ctx.globalAlpha = alpha;
                    ctx.fill();
                }
                // smoke (soft dark clouds)
                ctx.globalCompositeOperation = 'source-over';
                for (const s of this.smoke) {
                    if (s.life <= 0) continue;
                    const alpha = Math.max(0, Math.min(0.6, s.life / 80));
                    ctx.fillStyle = `rgba(60,60,60,${alpha.toFixed(3)})`;
                    ctx.beginPath();
                    ctx.ellipse(s.x, s.y, 18, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }
        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        // Game class
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.cameraX = 0;
                this.house = null;
                this.player = new Player(500, SCREEN_HEIGHT - GROUND_HEIGHT - 60);
                this.enemies = [];
                this.spawnEnemies();
            }
            spawnEnemies() {
                this.house = new House();
                this.enemies = [];
                const numEnemies = 2 + gameState.level;
                const leftCount = Math.ceil(numEnemies / 2);
                const rightCount = Math.floor(numEnemies / 2);
                const y = SCREEN_HEIGHT - GROUND_HEIGHT - 50;
                const speed = 2 + Math.floor(gameState.level / 2);
                // Left corner enemies
                for (let i = 0; i < leftCount; i++) {
                    const x = 50 + i * 90;
                    const enemy = new Enemy(x, y, 200);
                    enemy.speed = speed;
                    this.enemies.push(enemy);
                }
                // Right corner enemies
                for (let i = 0; i < rightCount; i++) {
                    const x = WORLD_WIDTH - 85 - i * 90;
                    const enemy = new Enemy(x, y, WORLD_WIDTH - 200);
                    enemy.speed = speed;
                    this.enemies.push(enemy);
                }
                // Chaser enemies (triangle) — cannot shoot, move directly toward player
                for (let i = 0; i < rightCount; i++) {
                    const cx = WORLD_WIDTH - 200 - i * 120;
                    const chaser = new ChaserEnemy(cx, y - 20);
                    chaser.speed = speed;
                    this.enemies.push(chaser);
                }
                // Reset fireballs
                gameState.fireballs = [];
                gameState.enemyFireballs = [];
            }
            update() {
                if (!gameState.gameRunning) return;
                // Show level banner for 1.5s at start
                if (gameState.showLevelBanner) {
                    gameState.levelBannerTimer++;
                    if (gameState.levelBannerTimer > FPS * 1.5) {
                        gameState.showLevelBanner = false;
                    }
                    return;
                }
                this.player.update(gameState.keys);
                this.house.update();
                this.cameraX = Math.max(0, Math.min(this.player.x - SCREEN_WIDTH / 2, WORLD_WIDTH - SCREEN_WIDTH));
                for (let enemy of this.enemies) {
                    enemy.update();
                }
                // ChaserEnemy reaching the house: explode and damage house by 20
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    if (e instanceof ChaserEnemy) {
                        const houseBox = { x: this.house.x, y: this.house.y, width: this.house.width, height: this.house.height };
                        if (checkCollision(e.getCollisionBox(), houseBox)) {
                            // spawn explosion effect at chaser location, remove chaser and apply damage
                            const ex = e.x + e.width / 2;
                            const ey = e.y + e.height / 2;
                            gameState.explosions.push(new Explosion(ex, ey));
                            this.enemies.splice(i, 1);
                            this.house.takeDamage(20);
                        }
                    }
                }
                // Update fireballs
                for (let fireball of gameState.fireballs) {
                    fireball.update();
                }
                for (let efb of gameState.enemyFireballs) {
                    efb.update();
                }
                // Update explosions
                for (let exp of gameState.explosions) exp.update();
                gameState.explosions = gameState.explosions.filter(e => !e.done);
                // Remove inactive fireballs
                gameState.fireballs = gameState.fireballs.filter(f => f.active);
                gameState.enemyFireballs = gameState.enemyFireballs.filter(f => f.active);
                // House wall collision — player fireballs repair, enemy fireballs damage
                if (!this.house.isDestroyed()) {
                    const leftWall = this.house.getLeftWallBox();
                    const rightWall = this.house.getRightWallBox();
                    for (let fb of gameState.fireballs) {
                        if (checkCollision(fb.getCollisionBox(), leftWall) || checkCollision(fb.getCollisionBox(), rightWall)) {
                            fb.active = false;
                            this.house.repair(10);
                        }
                    }
                    for (let efb of gameState.enemyFireballs) {
                        if (checkCollision(efb.getCollisionBox(), leftWall) || checkCollision(efb.getCollisionBox(), rightWall)) {
                            efb.active = false;
                            this.house.takeDamage(10);
                        }
                    }
                }
                // Fireball-enemy collision
                for (let fireball of gameState.fireballs) {
                    for (let i = this.enemies.length - 1; i >= 0; i--) {
                        const enemy = this.enemies[i];
                        if (checkCollision(fireball.getCollisionBox(), enemy.getCollisionBox())) {
                            // hit: reduce enemy health by 1 (each fireball counts as one hit)
                            enemy.health = (enemy.health || enemy.maxHealth || 2) - 1;
                            fireball.active = false;
                            // if enemy dead, remove and award score
                            if (enemy.health <= 0) {
                                this.enemies.splice(i, 1);
                                gameState.score += 50;
                            }
                        }
                    }
                }
                // Enemy fireball - player collision
                const playerBox = this.player.getCollisionBox();
                for (let efb of gameState.enemyFireballs) {
                    if (checkCollision(playerBox, efb.getCollisionBox())) {
                        efb.active = false;
                        gameState.lives--;
                        if (gameState.lives <= 0) {
                            // Reset level and lives to maxLives
                            gameState.lives = gameState.maxLives;
                            gameState.showLevelBanner = true;
                            gameState.levelBannerTimer = 0;
                            this.spawnEnemies();
                        }
                    }
                }
                // Check player-enemy collision
                for (let enemy of this.enemies) {
                    const enemyBox = enemy.getCollisionBox();
                    if (checkCollision(playerBox, enemyBox)) {
                        this.player.x = WORLD_WIDTH / 2;
                        this.player.y = SCREEN_HEIGHT - GROUND_HEIGHT - 60;
                        gameState.score = Math.max(0, gameState.score - 10);
                    }
                }
                // Level clear check
                if (this.enemies.length === 0) {
                    gameState.level++;
                    // Every 10 levels increase the maximum lives by 1
                    if (gameState.level % 10 === 0) {
                        gameState.maxLives += 1;
                    }
                    gameState.showLevelBanner = true;
                    gameState.levelBannerTimer = 0;
                    this.spawnEnemies();
                }
            }
            draw() {
                // Clear screen
                this.ctx.fillStyle = COLORS.LIGHT_BLUE;
                this.ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

                // Apply camera offset for all world elements
                this.ctx.save();
                this.ctx.translate(-this.cameraX, 0);

                // Draw sky
                this.ctx.fillStyle = COLORS.LIGHT_BLUE;
                this.ctx.fillRect(0, 0, WORLD_WIDTH, SCREEN_HEIGHT - GROUND_HEIGHT);
                // Draw ground
                this.ctx.fillStyle = COLORS.GREEN;
                this.ctx.fillRect(0, SCREEN_HEIGHT - GROUND_HEIGHT, WORLD_WIDTH, GROUND_HEIGHT);
                // Draw grass pattern
                this.ctx.strokeStyle = COLORS.DARK_GREEN;
                this.ctx.lineWidth = 2;
                for (let x = 0; x < WORLD_WIDTH; x += 50) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, SCREEN_HEIGHT - GROUND_HEIGHT);
                    this.ctx.lineTo(x + 25, SCREEN_HEIGHT - GROUND_HEIGHT + 10);
                    this.ctx.stroke();
                }
                // Draw house
                this.house.draw(this.ctx);
                // Draw player
                this.player.draw(this.ctx);
                // Draw enemies
                for (let enemy of this.enemies) {
                    enemy.draw(this.ctx);
                }
                // Draw fireballs
                for (let fireball of gameState.fireballs) {
                    fireball.draw(this.ctx);
                }
                // Draw enemy fireballs
                for (let efb of gameState.enemyFireballs) {
                    efb.draw(this.ctx);
                }
                // Draw explosions (world space)
                for (let exp of gameState.explosions) {
                    exp.draw(this.ctx);
                }

                this.ctx.restore(); // Remove camera transform — UI drawn in screen space below

                // Update score display
                document.getElementById('scoreValue').textContent = gameState.score;
                // Draw lives
                this.ctx.save();
                this.ctx.font = 'bold 28px Arial';
                this.ctx.fillStyle = COLORS.RED;
                this.ctx.textAlign = 'left';
                this.ctx.fillText('Lives: ' + gameState.lives, 20, 60);
                this.ctx.restore();
                // Draw level banner
                if (gameState.showLevelBanner) {
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.9;
                    this.ctx.fillStyle = COLORS.BLACK;
                    this.ctx.fillRect(SCREEN_WIDTH/2-180, SCREEN_HEIGHT/2-60, 360, 120);
                    this.ctx.globalAlpha = 1.0;
                    this.ctx.fillStyle = COLORS.YELLOW;
                    this.ctx.font = 'bold 48px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('Level ' + gameState.level, SCREEN_WIDTH/2, SCREEN_HEIGHT/2);
                    this.ctx.restore();
                }
            }
            run() {
                setInterval(() => {
                    this.update();
                    this.draw();
                }, 1000 / FPS);
            }
        }
        // Start game
        window.addEventListener('load', () => {
            window.game = {};
            const game = new Game();
            window.game.gameInstance = game;
            game.run();

            // Move event listeners here so 'game' is defined
            document.addEventListener('keydown', (e) => {
                gameState.keys[e.key] = true;
                if (e.key === 'Escape') {
                    gameState.gameRunning = false;
                    document.getElementById('gameOver').style.display = 'block';
                    document.getElementById('finalScore').textContent = gameState.score;
                }
                // Shoot fireball with SPACE
                if ((e.key === ' ' || e.code === 'Space') && gameState.gameRunning && !gameState.showLevelBanner) {
                    const player = game.player;
                    const dir = player.direction === Direction.LEFT ? -1 : 1;
                    const fireball = new Fireball(
                        player.x + player.width/2 + dir*player.width/2,
                        player.y + player.height/2,
                        dir
                    );
                    gameState.fireballs.push(fireball);
                }
            });
            document.addEventListener('keyup', (e) => {
                gameState.keys[e.key] = false;
            });
        });
    </script>
</body>
